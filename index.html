<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turf Stats</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1d2124;
    --line: #2a2f33;
    --text: #e8e6e1;
    --dim: #8b9096;
    --turf: #ff6a1a;
    --turf-dim: #7a3a15;
    --blue: #4ea8de;
    --blue-dim: #1f4258;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--turf); }
  header p {
    margin: 4px 0 0;
    color: var(--dim);
    font-size: 13px;
  }
  .search {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search input {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
  }
  .search input:nth-of-type(1):focus { border-color: var(--turf); }
  .search input:nth-of-type(2):focus { border-color: var(--blue); }
  .search button {
    background: var(--turf);
    color: #14171a;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
  }
  .search button:disabled { opacity: 0.5; }
  main {
    padding: 4px 20px 40px;
    max-width: 480px;
    margin: 0 auto;
  }
  .msg {
    color: var(--dim);
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }
  .msg.error { color: var(--turf); }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 8px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .card-top .name {
    font-size: 20px;
    font-weight: 700;
  }
  .card-top .rank {
    color: var(--turf);
    font-weight: 700;
    font-size: 15px;
  }
  .region {
    color: var(--dim);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .v {
    font-size: 19px;
    font-weight: 700;
  }
  .stat .l {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .medals {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .medals .l {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .medal-bars {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 40px;
  }
  .medal-bars i {
    flex: 1;
    background: var(--turf-dim);
    border-radius: 2px;
    min-height: 3px;
  }
  .medal-bars i.has { background: var(--turf); }

  .vs-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }
  .vs-head .who { max-width: 44%; }
  .vs-head .who.a { text-align: left; color: var(--turf); }
  .vs-head .who.b { text-align: right; color: var(--blue); }
  .vs-head .who .n { font-size: 17px; font-weight: 700; color: var(--text); }
  .vs-head .who .r { font-size: 12px; margin-top: 2px; }
  .vs-head .divider { color: var(--dim); font-size: 12px; }

  .crow { margin-bottom: 16px; }
  .crow .l {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    margin-bottom: 6px;
  }
  .crow .vals {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .crow .vals .a { color: var(--dim); }
  .crow .vals .b { color: var(--dim); }
  .crow .vals .a.lead { color: var(--turf); }
  .crow .vals .b.lead { color: var(--blue); }
  .crow .bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--line);
  }
  .crow .bar .a-fill { background: var(--turf-dim); }
  .crow .bar .a-fill.lead { background: var(--turf); }
  .crow .bar .b-fill { background: var(--blue-dim); }
  .crow .bar .b-fill.lead { background: var(--blue); }

  .medals-vs {
    margin-top: 4px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .medals-vs .row { margin-bottom: 12px; }
  .medals-vs .row .l {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .medals-vs .row.a .l { color: var(--turf); }
  .medals-vs .row.b .l { color: var(--blue); }
  .medals-vs .bars { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
  .medals-vs .bars i { flex: 1; border-radius: 2px; min-height: 3px; }
  .medals-vs .row.a .bars i { background: var(--turf-dim); }
  .medals-vs .row.a .bars i.has { background: var(--turf); }
  .medals-vs .row.b .bars i { background: var(--blue-dim); }
  .medals-vs .row.b .bars i.has { background: var(--blue); }
  .note {
    color: var(--dim);
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
  }

  .league-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 10px;
  }
  .league-btn:active { border-color: var(--turf); color: var(--text); }

  .league-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .league-head h2 {
    font-size: 16px;
    margin: 0;
  }
  .league-head .back {
    color: var(--turf);
    font-size: 13px;
    background: none;
    border: none;
    padding: 4px 0;
  }
  table.league {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.league th, table.league td {
    padding: 8px 4px;
    text-align: right;
    white-space: nowrap;
  }
  table.league th:first-child, table.league td:first-child { text-align: left; }
  table.league th:nth-child(2), table.league td:nth-child(2) { text-align: left; }
  table.league th {
    color: var(--dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  table.league tr:not(:last-child) td { border-bottom: 1px solid var(--line); }
  table.league tr.me { background: rgba(255,106,26,0.12); }
  table.league tr.me td:first-child { color: var(--turf); font-weight: 700; }
  .league-wrap { overflow-x: auto; }

  .tabs {
    display: flex;
    padding: 16px 20px 0;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto;
  }
  .tabs button {
    flex: 1;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .tabs button.active {
    border-color: var(--turf);
    color: var(--turf);
  }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<header>
  <h1>Turf<span>Stats</span></h1>
  <p>Sök en turfare eller en regions topplista</p>
</header>

<div class="tabs">
  <button id="tabPlayer" class="active" onclick="switchTab('player')">Spelare</button>
  <button id="tabLeague" onclick="switchTab('league')">Liga</button>
</div>

<div id="viewPlayer" class="view active">
  <div class="search">
    <input id="q1" type="text" placeholder="Spelare 1" autocomplete="off" autocapitalize="off">
    <input id="q2" type="text" placeholder="Spelare 2" autocomplete="off" autocapitalize="off">
    <button id="go">Sök</button>
  </div>
  <main id="result"></main>
</div>

<div id="viewLeague" class="view">
  <div class="search">
    <input id="lq" type="text" placeholder="Region, t.ex. Göteborg" autocomplete="off" autocapitalize="off">
    <button id="lgo">Sök liga</button>
  </div>
  <main id="leagueResult"></main>
</div>

<script>
const q1 = document.getElementById('q1');
const q2 = document.getElementById('q2');
const btn = document.getElementById('go');
const result = document.getElementById('result');
const lq = document.getElementById('lq');
const lgo = document.getElementById('lgo');
const leagueResult = document.getElementById('leagueResult');

function switchTab(tab) {
  document.getElementById('tabPlayer').classList.toggle('active', tab === 'player');
  document.getElementById('tabLeague').classList.toggle('active', tab === 'league');
  document.getElementById('viewPlayer').classList.toggle('active', tab === 'player');
  document.getElementById('viewLeague').classList.toggle('active', tab === 'league');
}

async function search() {
  const n1 = q1.value.trim();
  const n2 = q2.value.trim();
  if (!n1) return;

  btn.disabled = true;
  result.innerHTML = '<div class="msg">Söker...</div>';

  try {
    const names = n2 ? [n1, n2] : [n1];
    const res = await fetch('https://api.turfgame.com/v5/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(names.map(name => ({ name })))
    });

    if (!res.ok) throw new Error('API-fel');
    const data = await res.json();

    const userA = data.find(u => u.name.toLowerCase() === n1.toLowerCase());
    const userB = n2 ? data.find(u => u.name.toLowerCase() === n2.toLowerCase()) : null;

    if (!userA) {
      result.innerHTML = '<div class="msg error">Ingen turfare hittades med det namnet.</div>';
      return;
    }

    if (n2 && !userB) {
      render(userA);
      result.innerHTML += '<div class="note">Spelare 2 hittades inte.</div>';
    } else if (userB) {
      renderCompare(userA, userB);
    } else {
      render(userA);
    }
  } catch (e) {
    result.innerHTML = '<div class="msg error">Kunde inte hämta data. Kolla nätverk eller försök igen.</div>';
  } finally {
    btn.disabled = false;
  }
}

function render(u) {
  const medals = u.medals || [];
  const maxMedal = Math.max(1, ...medals);
  const bars = medals.map(m =>
    `<i class="${m > 0 ? 'has' : ''}" style="height:${m > 0 ? (m / maxMedal) * 100 : 4}%"></i>`
  ).join('');

  result.innerHTML = `
    <div class="card">
      <div class="card-top">
        <div class="name">${escapeHtml(u.name)}</div>
        <div class="rank">#${u.rank ?? '–'}</div>
      </div>
      <div class="region">${escapeHtml(u.region?.name || '')}${u.country ? ', ' + u.country.toUpperCase() : ''}</div>
      <div class="grid">
        <div class="stat"><div class="v">${fmt(u.points)}</div><div class="l">Poäng</div></div>
        <div class="stat"><div class="v">${fmt(u.totalPoints)}</div><div class="l">Totalpoäng</div></div>
        <div class="stat"><div class="v">${fmt(u.pointsPerHour)}</div><div class="l">Poäng/timme</div></div>
        <div class="stat"><div class="v">${fmt(u.taken)}</div><div class="l">Tagningar</div></div>
        <div class="stat"><div class="v">${fmt(u.uniqueZonesTaken)}</div><div class="l">Unika zoner</div></div>
        <div class="stat"><div class="v">${fmt(u.zones?.length)}</div><div class="l">Innehar nu</div></div>
      </div>
      ${medals.length ? `
      <div class="medals">
        <div class="l">Medaljer (${medals.filter(m => m > 0).length}/${medals.length})</div>
        <div class="medal-bars">${bars}</div>
      </div>` : ''}
    </div>
    ${u.region?.name ? `<button class="league-btn" onclick="loadLeague('${escapeHtml(u.region.name)}', ['${escapeHtml(u.name)}'])">Visa topplista för ${escapeHtml(u.region.name)}</button>` : ''}
  `;
}

const STAT_FIELDS = [
  ['points', 'Poäng'],
  ['totalPoints', 'Totalpoäng'],
  ['pointsPerHour', 'Poäng/timme'],
  ['taken', 'Tagningar'],
  ['uniqueZonesTaken', 'Unika zoner'],
];

function renderCompare(a, b) {
  const rows = STAT_FIELDS.map(([key, label]) => {
    const va = a[key] ?? 0;
    const vb = b[key] ?? 0;
    const total = va + vb || 1;
    const pa = (va / total) * 100;
    const pb = 100 - pa;
    const aLead = va > vb ? 'lead' : '';
    const bLead = vb > va ? 'lead' : '';
    return `
      <div class="crow">
        <div class="l">${label}</div>
        <div class="vals">
          <span class="a ${aLead}">${fmt(va)}</span>
          <span class="b ${bLead}">${fmt(vb)}</span>
        </div>
        <div class="bar">
          <div class="a-fill ${aLead}" style="width:${pa}%"></div>
          <div class="b-fill ${bLead}" style="width:${pb}%"></div>
        </div>
      </div>
    `;
  }).join('');

  const medalsA = a.medals || [];
  const medalsB = b.medals || [];
  const maxMedal = Math.max(1, ...medalsA, ...medalsB);
  const barsA = medalsA.map(m => `<i class="${m > 0 ? 'has' : ''}" style="height:${m > 0 ? (m / maxMedal) * 100 : 4}%"></i>`).join('');
  const barsB = medalsB.map(m => `<i class="${m > 0 ? 'has' : ''}" style="height:${m > 0 ? (m / maxMedal) * 100 : 4}%"></i>`).join('');

  result.innerHTML = `
    <div class="card">
      <div class="vs-head">
        <div class="who a">
          <div class="n">${escapeHtml(a.name)}</div>
          <div class="r">#${a.rank ?? '–'} · ${escapeHtml(a.region?.name || '')}</div>
        </div>
        <div class="divider">vs</div>
        <div class="who b">
          <div class="n">${escapeHtml(b.name)}</div>
          <div class="r">#${b.rank ?? '–'} · ${escapeHtml(b.region?.name || '')}</div>
        </div>
      </div>
      ${rows}
      ${medalsA.length || medalsB.length ? `
      <div class="medals-vs">
        <div class="row a">
          <div class="l">${escapeHtml(a.name)} (${medalsA.filter(m => m > 0).length}/${medalsA.length})</div>
          <div class="bars">${barsA}</div>
        </div>
        <div class="row b">
          <div class="l">${escapeHtml(b.name)} (${medalsB.filter(m => m > 0).length}/${medalsB.length})</div>
          <div class="bars">${barsB}</div>
        </div>
      </div>` : ''}
    </div>
    ${a.region?.name ? `<button class="league-btn" onclick="loadLeague('${escapeHtml(a.region.name)}', ['${escapeHtml(a.name)}', '${escapeHtml(b.name)}'])">Visa topplista för ${escapeHtml(a.region.name)}</button>` : ''}
  `;
}

function fmt(n) {
  if (n === undefined || n === null) return '–';
  return n.toLocaleString('sv-SE');
}

const LEAGUE_COLS = [
  ['place', 'Plac'],
  ['name', 'Namn'],
  ['points', 'Poäng'],
  ['pointsPerHour', 'P/h'],
  ['taken', 'Tagn.'],
  ['uniqueZonesTaken', 'Unika'],
];

let leagueSort = { key: 'place', dir: 1 };

async function loadLeague(regionName, highlightNames) {
  switchTab('league');
  lq.value = regionName;
  leagueResult.innerHTML = '<div class="msg">Hämtar topplista...</div>';
  leagueSort = { key: 'place', dir: 1 };

  try {
    const res = await fetch('https://api.turfgame.com/v5/users/top', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ region: regionName.toLowerCase(), from: 1, to: 50 })
    });

    if (!res.ok) throw new Error('API-fel');
    const list = await res.json();

    if (!list.length) {
      leagueResult.innerHTML = `<div class="msg error">Kunde inte hitta regionen "${escapeHtml(regionName)}".</div>`;
      return;
    }

    window._leagueData = list;
    window._leagueRegion = regionName;
    window._leagueHighlight = (highlightNames || []).map(n => n.toLowerCase());
    renderLeague();
  } catch (e) {
    leagueResult.innerHTML = '<div class="msg error">Kunde inte hämta topplista. Kolla nätverk eller försök igen.</div>';
  }
}

function searchLeague() {
  const name = lq.value.trim();
  if (!name) return;
  loadLeague(name, []);
}

function sortLeague(key) {
  if (leagueSort.key === key) {
    leagueSort.dir *= -1;
  } else {
    leagueSort = { key, dir: key === 'name' ? 1 : -1 };
  }
  renderLeague();
}

function renderLeague() {
  const list = [...window._leagueData];
  const highlight = window._leagueHighlight || [];
  const { key, dir } = leagueSort;

  list.sort((x, y) => {
    const vx = x[key], vy = y[key];
    if (typeof vx === 'string') return vx.localeCompare(vy) * dir;
    return ((vx ?? 0) - (vy ?? 0)) * dir;
  });

  const rows = list.map(u => `
    <tr class="${highlight.includes((u.name || '').toLowerCase()) ? 'me' : ''}">
      <td>${fmt(u.place)}</td>
      <td>${escapeHtml(u.name)}</td>
      <td>${fmt(u.points)}</td>
      <td>${fmt(u.pointsPerHour)}</td>
      <td>${fmt(u.taken)}</td>
      <td>${fmt(u.uniqueZonesTaken)}</td>
    </tr>
  `).join('');

  const headers = LEAGUE_COLS.map(([k, label]) =>
    `<th onclick="sortLeague('${k}')">${label}${leagueSort.key === k ? (leagueSort.dir === 1 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  leagueResult.innerHTML = `
    <div class="card">
      <div class="league-head">
        <h2>${escapeHtml(window._leagueRegion)}</h2>
      </div>
      <div class="league-wrap">
        <table class="league">
          <thead><tr>${headers}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

btn.addEventListener('click', search);
q1.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
q2.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
lgo.addEventListener('click', searchLeague);
lq.addEventListener('keydown', e => { if (e.key === 'Enter') searchLeague(); });
</script>

</body>
</html>
